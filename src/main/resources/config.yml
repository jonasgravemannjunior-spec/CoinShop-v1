# ============================================================
#  CoinShop - Einstellungen
#  Nach Änderungen im Spiel / in der Konsole: /coinsadmin reload
#  Hinweis: Wenn du eine alte config.yml hast, lösche sie einmal
#  (plugins/CoinShop/config.yml), damit diese neue erzeugt wird.
# ============================================================

# ---------------- Erfolge (Achievements) ----------------
# Je schwieriger der Erfolg, desto mehr Coins. So wird die Belohnung bestimmt:
#   1. Steht der Erfolg unter "overrides"            -> genau dieser Betrag
#   2. Steht er in der Liste "advancements" einer Stufe -> Belohnung dieser Stufe
#   3. Sonst nach Art des Erfolgs im Spiel (Aufgabe / Ziel / Herausforderung, siehe type-tiers)
# Erfolge heißen so wie im Spiel, z. B. "minecraft:story/mine_diamond".
# (Namen, die es nicht gibt, schaden nicht - sie werden einfach nie getroffen.)
achievements:
  enabled: true
  # Welche Stufe gilt standardmäßig für welche Art von Erfolg
  type-tiers:
    task: leicht          # normale Aufgabe (eckiges Symbol)
    goal: mittel          # Ziel (abgerundetes Symbol)
    challenge: schwer     # Herausforderung (gezacktes Symbol)
  tiers:
    leicht: {name: "Leicht", reward: 10}
    mittel: {name: "Mittel", reward: 30}
    schwer: {name: "Schwer", reward: 100}
    # Besonders schwierige Erfolge (handverlesen, zählt vor der Art des Erfolgs)
    sehr-schwer:
      name: "Sehr schwer"
      reward: 250
      advancements:
        - "minecraft:end/kill_dragon"
        - "minecraft:end/dragon_egg"
        - "minecraft:end/elytra"
        - "minecraft:end/respawn_dragon"
        - "minecraft:end/dragon_breath"
        - "minecraft:nether/summon_wither"
        - "minecraft:nether/get_wither_skull"
        - "minecraft:nether/create_beacon"
        - "minecraft:nether/netherite_armor"
        - "minecraft:nether/obtain_ancient_debris"
        - "minecraft:nether/uneasy_alliance"
        - "minecraft:nether/ride_strider_in_overworld_lava"
        - "minecraft:adventure/totem_of_undying"
        - "minecraft:adventure/hero_of_the_village"
        - "minecraft:adventure/very_very_frightening"
        - "minecraft:adventure/sniper_duel"
        - "minecraft:adventure/arbalistic"
        - "minecraft:adventure/spyglass_at_dragon"
        - "minecraft:adventure/overoverkill"
        - "minecraft:husbandry/obtain_netherite_hoe"
    extrem:
      name: "Extrem"
      reward: 600
      advancements:
        - "minecraft:adventure/kill_all_mobs"
        - "minecraft:adventure/adventuring_time"
        - "minecraft:adventure/trim_with_all_exclusive_armor_patterns"
        - "minecraft:nether/all_effects"
        - "minecraft:nether/all_potions"
        - "minecraft:nether/create_full_beacon"
        - "minecraft:husbandry/bred_all_animals"
        - "minecraft:husbandry/complete_catalogue"
        - "minecraft:husbandry/balanced_diet"
        - "minecraft:husbandry/leash_all_frog_variants"
        - "minecraft:husbandry/whole_pack"
  # Einzelne Erfolge mit einem festen Betrag (hat Vorrang vor allem anderen). Beispiel:
  overrides:
    # "minecraft:story/mine_diamond": 50

# ---------------- Coins allgemein ----------------
coins:
  # Größter Betrag, der auf einmal überwiesen werden darf (Schutz vor Tippfehlern)
  max-transfer: 1000000000

# ---------------- Tägliches Einkommen ----------------
# Wird für JEDEN bekannten Spieler (auch offline) zusammen mit dem Shop-Wechsel ausgezahlt.
# Dazu kommt das Einkommen aus Investitions-Sets. Diese Coins werden neu erzeugt (nicht vom Shop-Konto genommen).
daily-income:
  base: 10

# ---------------- Server-Shop ----------------
server-shop:
  # Wie viele Angebote gleichzeitig (das Menü ist für 10 gebaut - nicht ändern)
  offers: 10
  # Zeitzone und Uhrzeit des täglichen Wechsels
  timezone: "Europe/Berlin"
  reset-hour: 12
  # Wie oft ein Spieler EIN Angebot pro Tag kaufen darf (0 = unbegrenzt)
  purchase-limit-per-offer: 3

  # Chance (0.0 bis 1.0), dass ein Angebotsplatz ein verzaubertes Rüstungsteil bzw. ein
  # Verzauberungsbuch ist. Der Rest sind normale Items.
  enchanted-armor-chance: 0.12
  enchanted-book-chance: 0.18

  # Wie stark teure Items seltener erscheinen. Gewicht = 1 / (1 + Preis / rarity-divisor).
  # Größerer Wert = teure Items erscheinen häufiger. Sehr großer Wert (z. B. 1000000) = alle gleich oft.
  rarity-divisor: 1000

  # Was Verzauberungen kosten (Coins PRO STUFE). Rüstungspreis = Preis des Rüstungsteils + Summe der
  # Verzauberungen; ein Buch kostet nur die Verzauberung (mindestens 250). Der Name ist der Spielname
  # der Verzauberung. Alles, was hier fehlt, kostet "default".
  enchant-cost-per-level:
    default: 500
    protection: 1250
    fire_protection: 750
    blast_protection: 1000
    projectile_protection: 750
    feather_falling: 600
    thorns: 750
    unbreaking: 1000
    mending: 7500
    respiration: 750
    aqua_affinity: 1500
    depth_strider: 1000
    frost_walker: 2000
    soul_speed: 2000
    swift_sneak: 2500
    sharpness: 1250
    smite: 600
    bane_of_arthropods: 500
    knockback: 600
    fire_aspect: 1000
    looting: 1250
    sweeping_edge: 1000
    efficiency: 1000
    silk_touch: 4000
    fortune: 1750
    power: 1250
    punch: 600
    flame: 1500
    infinity: 5000
    luck_of_the_sea: 1000
    lure: 750
    loyalty: 750
    impaling: 750
    riptide: 1500
    channeling: 3000
    multishot: 2500
    quick_charge: 1000
    piercing: 750
    density: 1500
    breach: 2000
    wind_burst: 3000

  # Preis pro EINZELNEM Item, wenn unten nichts passt
  default-price: 15

  # Diese Items erscheinen NIE (Dinge, die es im Survival nicht gibt oder die sinnlos wären).
  # Mit * am Anfang/Ende kannst du Gruppen angeben, z. B. "*_SPAWN_EGG".
