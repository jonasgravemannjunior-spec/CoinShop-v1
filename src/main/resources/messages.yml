inventory-full: "<red>Dein Inventar ist zu voll. Mach Platz und versuch es nochmal."
server-bought: "Du hast <white><amount>x <item></white> für <gold><coins> Coins</gold> gekauft."

# ---------- Spieler-Shop ----------
hold-item: "<red>Halte das Item, das du verkaufen willst, in der Hand."
item-blacklisted: "<red>Dieses Item darf nicht im Spieler-Shop angeboten werden."
price-range: "<red>Der Preis muss zwischen <min> und <max> Coins liegen."
no-free-slot: "<red>Du hast keinen freien Verkaufs-Slot. Kaufe unter <white>/shop > Spieler-Shop > Meine Angebote</white> einen Slot (nächster Slot: <gold><price> Coins</gold>)."
slot-too-expensive: "<red>Dir fehlen Coins: Der nächste Slot kostet <gold><price> Coins</gold>."
slot-max: "<red>Du hast bereits die Höchstzahl von <white><max> Slots</white>."
slot-bought-max: "<green>Slot gekauft!</green> Du hast jetzt <white><slots> Slots</white> - das ist das Maximum."
