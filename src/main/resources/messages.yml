claim-taken: "<gray>Du hast das Item abgeholt."
claims-waiting: "<yellow>Du hast <count> Item(s) zur Abholung: <white>/shop > Spieler-Shop > Meine Angebote > Abholung</white>."

# ---------- Glücksrad ----------
wheel-not-enough: "<red>Eine Drehung kostet <price> Coins - so viel hast du nicht."
wheel-nothing: "<gray>Leider eine Niete. Dein Einsatz geht auf das Shop-Konto. Mehr Glück beim nächsten Mal!"
wheel-win: "<green>Gewonnen!</green> Du bekommst <gold><coins> Coins</gold> vom Shop-Konto."
wheel-win-capped: "<yellow>Gewonnen, aber das Shop-Konto war nicht voll genug.</yellow> Ausgezahlt: <gold><coins> Coins</gold>."
wheel-jackpot: "<gold><bold>JACKPOT!</bold></gold> Du hast das ganze Shop-Konto geknackt: <gold><coins> Coins</gold>!"
wheel-jackpot-broadcast: "<gold><bold>JACKPOT!</bold></gold> <white><player></white> hat am Glücksrad das gesamte Shop-Konto gewonnen: <gold><coins> Coins</gold>!"

# ---------- Investitionen ----------
invest-taken: "<red>Dieses Item gehört schon jemandem."
invest-bought: "Du hast <white><item></white> aus dem Set <white><set></white> für <gold><price> Coins</gold> gekauft. <gray>Dein Einkommen aus diesem Set: <gold>+<income> Coins/Tag</gold>"
